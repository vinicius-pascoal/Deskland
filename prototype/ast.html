<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Deskland · 语法树（原型）</title>
<!--
  Deskland · 语法树主题（抽象语法树；Canvas 2D，极简）
  - 图标是语法树的节点：每个图标找它上方最近的节点当父节点，标上 Call、Block、Identifier 之类的类型；
    空地上再按语法规则长出一些小节点（Identifier、Literal……），树枝从上往下分叉
  - "解析器"按先序遍历一个个点亮节点，一道光沿树枝从父节点走到子节点；底部的源码条同步高亮当前的词
  - 多个显示器：最顶上一个 Program 横跨所有屏幕，每块屏幕是它下面的一个 Module；按系统时钟同步，每轮一起开始
  - 节点类型和名字都是编出来的，不读取任何真实代码
  性能：网格、树枝、节点画进静态缓存（图标或设置变化时重画，新旧交叉淡入）；每帧只贴缓存，再画几个被点亮的节点和一道光
-->
<style>
  :root { --taskbar: 48px; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #f6f3ec; }
  body { font-family: "Segoe UI Variable Text", "Segoe UI", "Microsoft YaHei UI", "Microsoft YaHei", system-ui, sans-serif; }
  #art { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; }
  #desktop { position: fixed; left: 0; top: 0; right: 0; bottom: var(--taskbar); }
  .icon {
    position: absolute; width: 76px; padding: 4px 2px 5px;
    display: flex; flex-direction: column; align-items: center;
    border: 1px solid transparent; border-radius: 4px;
    user-select: none; touch-action: none; cursor: default;
  }
  .icon:hover { background: rgba(255,255,255,.12); border-color: rgba(255,255,255,.2); }
  .icon.drag { opacity: .88; z-index: 10; transform: scale(1.04); }
  .icon.settle { transition: left .22s cubic-bezier(.2,.8,.3,1), top .22s cubic-bezier(.2,.8,.3,1); }
  .glyph { width: 48px; height: 48px; border-radius: 10px; display: grid; place-items: center; color: #fff;
    font-size: 21px; font-weight: 700; box-shadow: 0 2px 6px rgba(0,0,0,.35); pointer-events: none; }
  .label {
    margin-top: 3px; max-width: 72px; font-size: 12px; line-height: 15px; color: #fff; text-align: center;
    text-shadow: 0 0 2px rgba(0,0,0,.95), 0 1px 3px rgba(0,0,0,.85);
    word-break: break-all; overflow: hidden;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; pointer-events: none;
  }
  #taskbar {
    position: fixed; left: 0; right: 0; bottom: 0; height: var(--taskbar);
    background: rgba(20,22,30,.62); backdrop-filter: blur(28px) saturate(1.6); -webkit-backdrop-filter: blur(28px) saturate(1.6);
    border-top: 1px solid rgba(255,255,255,.08); z-index: 40;
  }
  #hint {
    position: fixed; top: 14px; right: 14px; padding: 10px 14px; border-radius: 10px; z-index: 50;
    background: rgba(30,28,24,.82); color: #f6f3ec; font-size: 12px; line-height: 1.6;
    border: 1px solid rgba(255,255,255,.14); backdrop-filter: blur(16px);
  }
  #hint.hidden { display: none; }
  body.wall #desktop, body.wall #taskbar, body.wall #hint { display: none; }
  #ghosts { position: fixed; inset: 0; pointer-events: none; display: none; }
  body.preview #ghosts { display: block; }
  .ghost { position: absolute; }
  .ghost i { position: absolute; left: 50%; top: 4px; width: 48px; height: 48px; margin-left: -24px; border-radius: 9px;
    background: rgba(255,255,255,.88); box-shadow: 3px 6px 8px rgba(0,0,0,.35); }
  .ghost b { position: absolute; left: 14%; right: 14%; top: 60px; height: 10px; border-radius: 5px; background: rgba(255,255,255,.75); }
</style>
</head>
<body>
<canvas id="art"></canvas>
<div id="desktop"></div>
<div id="taskbar"></div>
<div id="hint"><b>Deskland · 语法树</b><br>拖动图标，语法树会重新长好<br>R 换一张 · P 换配色 · H 隐藏提示</div>

<script>
'use strict';

/* ======================================================================
   参数（默认值和 themes.json 里语法树主题的 default 保持一致）
   ====================================================================== */
const CELL_W = 76, CELL_H = 100, GRID_X0 = 4, GRID_Y0 = 6, TASKBAR = 48;
const MORPH_MS = 1000, NODE_H = 22, STRIP_H = 34;

const QS = new URLSearchParams(location.search);
const WALL = QS.has('wallpaper');
const PREVIEW = QS.has('preview');
const STILL = QS.has('still');
const P = { palette: 0, density: 0.6, values: 1, groups: 1, speed: 1, strip: 1 };
const DEFAULTS = Object.assign({}, P);
const LIMITS = { palette: [0, 2], density: [0, 1], values: [0, 1], groups: [0, 1], speed: [0.25, 3], strip: [0, 1] };
const INTS = new Set(['palette', 'values', 'groups', 'strip']);
const GROUP_GAP = 30;   // 两个图标之间的空隙小于这个（像素）就算同一组；隔一个空格子的不算

const cv = document.getElementById('art');
const ctx = cv.getContext('2d', { alpha: false });
let W = innerWidth, H = innerHeight;
let icons = [];
let seed = QS.has('seed') ? (+QS.get('seed') | 0) : (WALL || PREVIEW) ? 20261113 : (Math.random() * 1e6) | 0;
const FIX_NOW = QS.has('now') ? +QS.get('now') : null;
const wallClock = () => FIX_NOW !== null ? FIX_NOW + performance.now() / 1000 : Date.now() / 1000;

/* ---------- 显示器布局（CSS 像素，虚拟桌面坐标；调试：?me=x,y&all=x,y,w,h;...） ---------- */
let MON = { x: 0, y: 0 }, SCREENS = null;
if (QS.has('me')) { const [x, y] = QS.get('me').split(',').map(Number); MON = { x: x || 0, y: y || 0 }; }
if (QS.has('all')) SCREENS = QS.get('all').split(';').filter(Boolean).map(s => s.split(',').map(Number));
function screensCss() { return SCREENS && SCREENS.length ? SCREENS : [[MON.x, MON.y, W, H]]; }
function deskBounds() {
  let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
  for (const [x, y, w, h] of screensCss()) { x0 = Math.min(x0, x); y0 = Math.min(y0, y); x1 = Math.max(x1, x + w); y1 = Math.max(y1, y + h); }
  return { x: x0, y: y0, w: x1 - x0, h: y1 - y0 };
}
const multi = () => !!(SCREENS && SCREENS.length > 1);
const monSalt = () => (Math.round(MON.x) * 7 + Math.round(MON.y) * 13) | 0;

function mulberry32(a) {
  return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
}
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const ease = t => t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;

/* ======================================================================
   配色：纸张 / 石板 / 蓝图
   ====================================================================== */
const PALS = [
  { bg: '#f6f3ec', grid: 'rgba(60,50,30,0.07)', edge: '#c8bfac', node: '#fffdf8', nodeT: 'rgba(255,253,248,0)', nodeEdge: '#d6ccb8', text: '#3b3630', muted: '#9a907e',
    val: '#b4532a', accent: '#d9480f', soft: 'rgba(217,72,15,0.14)', frame: 'rgba(120,100,70,0.16)' },
  { bg: '#12161d', grid: 'rgba(200,220,255,0.06)', edge: '#3a4555', node: '#1a2029', nodeT: 'rgba(26,32,41,0)', nodeEdge: '#2e3847', text: '#d5dbe5', muted: '#7d8899',
    val: '#7ee0c3', accent: '#7ee0c3', soft: 'rgba(126,224,195,0.16)', frame: 'rgba(200,220,255,0.12)' },
  { bg: '#123a63', grid: 'rgba(255,255,255,0.08)', edge: 'rgba(220,235,255,0.42)', node: '#164473', nodeT: 'rgba(22,68,115,0)', nodeEdge: 'rgba(220,235,255,0.5)', text: '#eaf3ff',
    muted: '#a9c4e4', val: '#ffd479', accent: '#ffd479', soft: 'rgba(255,212,121,0.18)', frame: 'rgba(220,235,255,0.25)' },
];
const MONO = '"Cascadia Mono", Consolas, "Courier New", monospace';

/* ======================================================================
   语法规则：每种节点下面能长出哪些子节点（ESTree 风格，名字用短写）
   ====================================================================== */
const STMTS = ['FuncDecl', 'VarDecl', 'ExprStmt', 'If', 'Return', 'Import', 'ForOf'];
const EXPRS = ['Call', 'Binary', 'Identifier', 'Literal', 'Member', 'Arrow'];
const GRAMMAR = {
  FuncDecl: ['Identifier', 'Params', 'Block'], Params: ['Identifier', 'Identifier'], Block: ['$stmt', '$stmt'],
  VarDecl: ['Declarator'], Declarator: ['Identifier', '$expr'], ExprStmt: ['Call'], Call: ['Member', '$expr'],
  Member: ['Identifier', 'Identifier'], If: ['Binary', 'Block'], Binary: ['Identifier', 'Literal'], Return: ['$expr'],
  Import: ['Specifier', 'Literal'], Specifier: ['Identifier'], ForOf: ['Identifier', 'Identifier', 'Block'], Arrow: ['Params', 'Binary'],
  ClassDecl: ['Identifier', 'Method'], Method: ['Params', 'Block'], Property: ['Identifier', '$expr'], ArrayExpr: ['$expr', '$expr'],
  Identifier: [], Literal: [],
};
const KEYWORD = { FuncDecl: 'function', VarDecl: 'const', ExprStmt: ';', If: 'if', Return: 'return', Import: 'import', ForOf: 'for',
  Params: '(', Block: '{', Declarator: '=', Call: '(', Member: '.', Binary: '*', Specifier: '{', Arrow: '=>', Program: '', Module: '',
  ClassDecl: 'class', Method: '(', Property: ':', ArrayExpr: '[' };
// 分组的形状决定它是哪种代码块：一列 → 函数（从上往下的语句），一行 → 数组（元素），成片 → 类（方法和属性）
const groupType = (cols, rows) => rows === 1 ? 'ArrayExpr' : cols === 1 ? 'FuncDecl' : 'ClassDecl';
const CLOSER = { ArrayExpr: ']', FuncDecl: '}', ClassDecl: '}' };
function memberType(type, rng) {
  if (type === 'ClassDecl') return rng() < 0.6 ? 'Method' : 'Property';
  if (type === 'ArrayExpr') return EXPRS[Math.floor(rng() * EXPRS.length)];
  return STMTS[Math.floor(rng() * STMTS.length)];
}
const WORDS = ['icon', 'layout', 'desk', 'grid', 'shore', 'cloud', 'frame', 'cache', 'pixel', 'scale', 'seed', 'wave', 'tile', 'sprite', 'layer',
  'noise', 'state', 'theme', 'light', 'shadow', 'cursor', 'screen', 'node', 'token', 'parse', 'emit', 'scope', 'visit'];
const isLeaf = t => !GRAMMAR[t] || GRAMMAR[t].length === 0 && t !== 'Program' && t !== 'Module';
function kidTypes(type, rng) {
  if (type === 'Program' || type === 'Module') { const n = 3 + Math.floor(rng() * 3), a = []; for (let i = 0; i < n; i++) a.push(STMTS[Math.floor(rng() * STMTS.length)]); return a; }
  return (GRAMMAR[type] || []).map(t => t === '$stmt' ? STMTS[Math.floor(rng() * STMTS.length)] : t === '$expr' ? EXPRS[Math.floor(rng() * EXPRS.length)] : t);
}
function valueOf(type, rng) {
  if (type === 'Identifier' || type === 'Method' || type === 'Property') return WORDS[Math.floor(rng() * WORDS.length)];
  if (type === 'Literal') return rng() < 0.5 ? String(Math.floor(rng() * 100)) : `"${WORDS[Math.floor(rng() * WORDS.length)]}"`;
  return '';
}

/* ======================================================================
   树的规划
   ====================================================================== */
let T = null;    // { nodes, root, order, tokens, strip }
const mctx = document.createElement('canvas').getContext('2d');
function pillSize(n) {
  mctx.font = `11px ${MONO}`;
  const tw = mctx.measureText(n.type).width, vw = P.values && n.val ? mctx.measureText(' ' + n.val).width : 0;
  const cw = n.count ? mctx.measureText(' ×' + n.count).width : 0;
  n.w = Math.ceil(tw + vw + cw + 18); n.h = NODE_H;
}
// 图标节点的框：左右往里收一点（同一排相邻图标的框不重叠），上下放一点；
// 分组节点：整个分组的框，再往上包住压在上边框中间的标题（树枝从标题上方进来、从框底下出去）
const rectOf = n => n.ic ? { x: n.ic.x + 3, y: n.ic.y - 3, w: n.ic.w - 6, h: n.ic.h + 6 }
  : n.frame ? { x: n.frame.x, y: n.frame.y - NODE_H / 2, w: n.frame.w, h: n.frame.h + NODE_H / 2 }
  : { x: n.x - n.w / 2, y: n.y - n.h / 2, w: n.w, h: n.h };
const pillRect = n => ({ x: n.x - n.w / 2, y: n.y - n.h / 2, w: n.w, h: n.h });
// 图标分组：两个图标的空隙小于 GROUP_GAP 就连起来（并查集），一组至少两个图标
function iconGroups() {
  const parent = icons.map((_, i) => i), find = i => parent[i] === i ? i : (parent[i] = find(parent[i]));
  if (P.groups) for (let i = 0; i < icons.length; i++) for (let j = i + 1; j < icons.length; j++)
    if (hit(icons[i], icons[j], GROUP_GAP)) parent[find(i)] = find(j);
  const map = new Map();
  icons.forEach((ic, i) => { const r = find(i); if (!map.has(r)) map.set(r, []); map.get(r).push(ic); });
  return [...map.values()];
}
// 按中心坐标数有几列、几行（相差不到 20px 算同一列 / 行）
function lanes(vals) { const s = vals.slice().sort((a, b) => a - b); let n = 0, last = -1e9; for (const v of s) { if (v - last > 20) n++; last = v; } return n; }
const hit = (a, b, pad) => a.x - pad < b.x + b.w && a.x + a.w + pad > b.x && a.y - pad < b.y + b.h && a.y + a.h + pad > b.y;
function plan() {
  const rng = mulberry32((seed ^ 0xa57) + monSalt()), nodes = [], tags = [];
  const bottom = H - TASKBAR - 8 - (P.strip ? STRIP_H + 14 : 0);
  const blocked = (r, pad) => r.x < 6 || r.y < 6 || r.x + r.w > W - 6 || r.y + r.h > bottom ||
    icons.some(ic => hit(ic, r, pad)) || nodes.some(n => hit(rectOf(n), r, pad)) || tags.some(t => hit(t, r, pad));
  // 根：多屏时是这块屏幕的 Module（屏幕上方，靠近中间），单屏是 Program（最上面）；找一处没有图标的地方
  const root = { type: multi() ? 'Module' : 'Program', val: '', kids: [], depth: 0, syn: 0 };
  pillSize(root);
  root.y = multi() ? 110 : 34;
  for (const f of [0.5, 0.42, 0.58, 0.34, 0.66, 0.26, 0.74]) { root.x = W * f; if (!blocked(rectOf(root), 8)) break; }
  nodes.push(root);
  // 单位：单独的图标，或者一组图标（画成一个代码块：虚线框 + 压在上边框中间的标题，组员不再一个个连树枝）
  const ins = icons.map(ic => ({ ic, x: ic.x + ic.w / 2, y: ic.y + ic.h / 2, kids: [], syn: 0 }));
  const nodeOf = new Map(ins.map(n => [n.ic, n]));
  const units = [];
  for (const g of iconGroups()) {
    if (g.length === 1) { units.push(nodeOf.get(g[0])); continue; }
    let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
    for (const ic of g) { x0 = Math.min(x0, ic.x); y0 = Math.min(y0, ic.y); x1 = Math.max(x1, ic.x + ic.w); y1 = Math.max(y1, ic.y + ic.h); }
    const frame = { x: x0 - 10, y: y0 - 16, w: x1 - x0 + 20, h: y1 - y0 + 26 };
    const members = g.map(ic => nodeOf.get(ic)).sort((a, b) => a.ic.y - b.ic.y || a.ic.x - b.ic.x);
    const gn = { frame, members, kids: [], syn: 0, x: frame.x + frame.w / 2, y: frame.y, count: g.length,
      type: groupType(lanes(g.map(ic => ic.x + ic.w / 2)), lanes(g.map(ic => ic.y + ic.h / 2))) };
    gn.val = valueOf('Identifier', rng); pillSize(gn);
    if (frame.y < 2) { frame.h -= 2 - frame.y; frame.y = 2; }
    // 分组贴着屏幕顶、上方放不下标题：标题挪到框外的右上角（右边放不下就左边），用一小段线连到框上
    if (frame.y - NODE_H / 2 < 4) {
      gn.side = true; gn.y = frame.y + NODE_H / 2 - 1;
      gn.x = frame.x + frame.w + 12 + gn.w / 2;
      if (gn.x + gn.w / 2 > W - 6) gn.x = frame.x - 12 - gn.w / 2;
      tags.push(pillRect(gn));
    }
    for (const m of members) { m.member = gn; m.parent = gn; gn.kids.push(m); }
    units.push(gn);
  }
  // 按从上到下的顺序，给每个单位找上方最近的单位当父节点（根总是候选）；孩子多的父节点稍微减分，让树分叉
  const topOf = u => u.frame ? u.frame.y - NODE_H / 2 : u.ic.y;
  const bottomOf = u => u.frame ? u.frame.y + u.frame.h : u.ic.y + u.ic.h;
  const ownKids = u => u.frame ? u.kids.length - u.members.length : u.kids.length;
  units.sort((a, b) => topOf(a) - topOf(b) || a.x - b.x);
  for (const n of units) {
    let best = root, bc = Math.abs(n.x - root.x) + 0.5 * Math.abs(topOf(n) - root.y) + 30 * root.kids.length + 120;
    for (const m of nodes) {
      if (!(m.ic || m.frame) || m.member || bottomOf(m) > topOf(n) + 4) continue;
      const c = Math.abs(n.x - m.x) + 0.5 * (topOf(n) - bottomOf(m)) + 30 * ownKids(m);
      if (c < bc) { bc = c; best = m; }
    }
    n.parent = best; best.kids.push(n); n.depth = best.depth + 1;
    nodes.push(n);
    if (n.frame) for (const m of n.members) { m.depth = n.depth + 1; nodes.push(m); }
  }
  // 从上往下定类型：组员按代码块的种类挑；其余从父节点的语法里挑，自己还有孩子的就挑不是叶子的类型
  const assign = (m) => {
    const opts = kidTypes(m.type, rng);
    m.kids.forEach((k, i) => {
      if (!k.frame) {
        let t = k.member ? memberType(m.type, rng) : opts.length ? opts[i % opts.length] : 'Block';
        if (k.kids.length && isLeaf(t)) t = opts.find(o => !isLeaf(o)) || (m.type === 'Program' || m.type === 'Module' ? 'FuncDecl' : 'Block');
        k.type = t; k.val = valueOf(t, rng);
      }
      assign(k);
    });
  };
  assign(root);
  // 类型标签：单独的图标放在图标右边（空着的话），否则左边，都不行才压在框的上边；
  // 组员的标签排在分组框的右边（或左边），每排一个，对齐成一列；放不下就不放
  mctx.font = `10px ${MONO}`;
  for (const n of ins) {
    const tw = mctx.measureText(n.type).width + 12, r = rectOf(n), cy = n.ic.y + Math.min(28, n.ic.h * 0.35);
    const f = n.member && n.member.frame;
    let pos = null;
    for (const x of f ? [f.x + f.w + 6, f.x - 6 - tw] : [r.x + r.w + 6, r.x - 6 - tw]) {
      const q = { x, y: cy - 8, w: tw, h: 16 };
      if (!blocked(q, 3)) { pos = q; break; }
    }
    n.tag = pos || (f ? null : { x: r.x + r.w / 2 - tw / 2, y: Math.max(1, r.y - 8), w: tw, h: 16 });
    if (pos) tags.push(pos);
  }
  // 空地上按语法长出小节点（广度优先：上层先占位置）；分组是完整的代码块，不再往外长
  const maxSyn = Math.round(1 + P.density * 3), budget = Math.round(20 + P.density * 110);
  const queue = [root, ...units.filter(u => !u.frame)];
  let made = 0;
  while (queue.length && made < budget) {
    const m = queue.shift();
    if (m.syn >= maxSyn) continue;
    let want = kidTypes(m.type, rng).slice(m.kids.length);
    if (m === root) want = want.slice(0, Math.max(0, 5 - m.kids.length));
    if (m.syn > 0 && P.density < 1) want = want.filter(() => rng() < 0.45 + 0.5 * P.density);
    if (!want.length) continue;
    const kids = want.map(t => { const k = { type: t, val: valueOf(t, rng), kids: [], parent: m, depth: m.depth + 1, syn: m.syn + 1 }; pillSize(k); return k; });
    const r = rectOf(m), gap = 16, total = kids.reduce((a, k) => a + k.w, 0) + gap * (kids.length - 1);
    const rootWide = m === root;
    // 候选：正下方一排；放不下就挪一挪，或者放到右边 / 左边
    const tries = rootWide ? [[0, 70], [0, 110], [0, 150]] : [[0, 40], [-40, 40], [40, 40], [0, 70], ['R', 0], ['L', 0], ['R', 36]];
    for (const k of kids) {
      for (const [dx, dy] of tries) {
        let x, y;
        if (rootWide) {
          const i = kids.indexOf(k);
          x = W * (i + 1) / (kids.length + 1); y = r.y + r.h + dy;
        } else if (dx === 'R' || dx === 'L') {
          const i = kids.indexOf(k);
          x = dx === 'R' ? r.x + r.w + 26 + k.w / 2 : r.x - 26 - k.w / 2; y = r.y + r.h * 0.35 + i * (NODE_H + 12) + dy;
        } else {
          const i = kids.indexOf(k), before = kids.slice(0, i).reduce((a, q) => a + q.w + gap, 0);
          x = m.x - total / 2 + before + k.w / 2 + dx; y = r.y + r.h + dy + NODE_H / 2;
        }
        k.x = x; k.y = y;
        if (!blocked(rectOf(k), 9)) { nodes.push(k); m.kids.push(k); queue.push(k); made++; break; }
      }

  document.getElementById('ghosts').innerHTML = icons.map(ic => `<div class="ghost" style="left:${ic.x}px;top:${ic.y}px;width:${ic.w}px;height:${ic.h}px"><i></i><b></b></div>`).join('');
}
function startHostedMode() {
  document.body.classList.add('wall');
  if (PREVIEW) {
    document.body.classList.add('preview');
    const g = document.createElement('div'); g.id = 'ghosts'; document.body.appendChild(g);
  }
  icons = [];
  let first = true;
  const handle = m => {
    if (m.t === 'pause') { paused = PREVIEW ? false : !!m.v; return; }
    if (m.t === 'screens') { setScreens(m); return; }
    if (m.t === 'settings') { applySettings(m.v || {}); return; }
    if (m.t === 'reset') { applySettings(Object.assign({}, DEFAULTS, m.v || {})); return; }
    if (m.t !== 'icons') return;
    const k = window.devicePixelRatio || 1;
    icons = m.vis ? m.r.map(([l, t, r, b]) => ({ x: l / k, y: t / k, w: (r - l) / k, h: (b - t) / k })) : [];
    if (PREVIEW) drawGhosts();
    iconsSeen = true;
    commit(first);
    first = false;
  };
  if (PREVIEW) {
    addEventListener('message', ev => { if (ev.source === parent) handle(typeof ev.data === 'string' ? JSON.parse(ev.data) : ev.data); });
    parent.postMessage(JSON.stringify({ t: 'ready' }), '*');
    return;
  }
  const host = window.chrome && window.chrome.webview;
  if (!host) return;
  host.addEventListener('message', ev => handle(JSON.parse(ev.data)));
  host.postMessage('ready');
}

/* ---------- 启动 ---------- */
window.__dbg = {
  P, commit, reseed,
  bench() {
    const ts = [];
    for (let i = 0; i < 10; i++) { const a = performance.now(); draw(performance.now()); ts.push(performance.now() - a); }
    ts.sort((a, b) => a - b);
    const a = performance.now(); commit(false); const c = performance.now() - a;
    return { frame: +ts[5].toFixed(2), commit: +c.toFixed(1), nodes: T.nodes.length, canvas: cv.width + 'x' + cv.height };
  },
};
resize();
if (WALL || PREVIEW) startHostedMode();
else { sampleLayout(); commit(true); }
requestAnimationFrame(frame);
</script>
